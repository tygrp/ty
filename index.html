<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TY 그룹웨어</title>
<meta property="og:title" content="TY 그룹웨어">
<meta property="og:description" content="티지와이 · 티와이 · 선교농원 · 티지와이F&amp;B">
<link rel="preconnect" href="https://gas-qguugvbmha-du.a.run.app">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d2a1c;color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.sp{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#e8930c;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
a{color:#ffc565}</style>
</head>
<body>
<div><div class="sp"></div><div id="m">TY 그룹웨어를 여는 중…</div></div>
<script>
/* 그룹웨어 화면을 Apps Script 에서 받아 이 주소(GitHub) 안에서 그림.
   빠르게: 지난번에 받은 화면을 이 기기에 저장해 두고 바로 그린 뒤, 뒤에서 새 화면을 받아 바뀌었으면 한 번만 새로 고침.
   ?p=about 회사 소개 · ?p=hdash 출근 현황 · ?p=hpop 출근부 입력 … (없으면 로그인 첫 화면) */
(function () {
var APP = "https://gas-qguugvbmha-du.a.run.app/ty/exec";   /* 새 서버 (2026-10-25 전환) · 되돌리려면 아래 옛 주소로 */
/* 옛 Apps Script: https://script.google.com/macros/s/AKfycbznKmaMD0Kp1Jb_9ayCeNDvl8U0XrbYK1v0NpNulgjhi2lMbQz1PmHYtCZSH1t3iyEM/exec */
var p = new URLSearchParams(location.search).get("p") || "";
var base = location.origin + location.pathname.replace(/[^\/]*$/, "");
var K = "tyPage|" + p + "|" + APP, RK = "tyReload|" + p;
function get(k, s) { try { return (s || localStorage).getItem(k); } catch (e) { return null; } }
function put(k, v, s) { try { (s || localStorage).setItem(k, v); } catch (e) { try { Object.keys(localStorage).filter(function (x) { return x.indexOf("tyPage|") === 0 && x !== K; }).forEach(function (x) { localStorage.removeItem(x); }); localStorage.setItem(k, v); } catch (e2) {} } }
function draw(h) { function go() { document.open(); document.write(h); document.close(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go(); }   /* 읽는 중에 쓰면 덧붙여지므로 다 읽은 뒤 바꿔 그림 */
window.TY_GH_APP = APP;   /* 첫 화면이 메뉴 화면을 미리 받아 둘 때 같은 열쇠를 씀 */
var old = get(K);
function load(n) {   /* 30초 안에 안 오거나 오류면 2번 더 시도 (구글 서버가 가끔 늦거나 잠깐 404) */
  var ac = window.AbortController ? new AbortController() : null, tm = setTimeout(function () { if (ac) ac.abort(); }, 30000);
  return fetch(APP + "?api=page&p=" + encodeURIComponent(p) + "&base=" + encodeURIComponent(base) + (n ? "&r=" + n : ""), { credentials: "omit", redirect: "follow", signal: ac ? ac.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (h) { clearTimeout(tm); if (h.indexOf("<html") < 0) throw new Error(h.slice(0, 80)); put(K, h); return h; })
    .catch(function (e) { clearTimeout(tm); if (n >= 2) throw (e && e.name === "AbortError" ? new Error("응답이 30초 넘게 없습니다") : e);
      var m = document.getElementById("m"); if (m && !old) m.textContent = "다시 연결하는 중… (" + (n + 2) + "/3)";
      return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return load(n + 1); }); });
}
var t0 = Date.now(), tick = setInterval(function () { var m = document.getElementById("m"); if (!m) return clearInterval(tick); var s = Math.round((Date.now() - t0) / 1000); if (s >= 5 && /여는 중/.test(m.textContent)) m.textContent = "TY 그룹웨어를 여는 중… " + s + "초"; }, 1000);
var f = load(0);
if (old) {
  draw(old);
  f.then(function (h) {
    /* 새 버전이 올라갔으면 한 번만 다시 엶 (10초 안에 또 바뀌면 다음 번에) */
    if (h !== old && Date.now() - Number(get(RK, sessionStorage) || 0) > 10000) { put(RK, String(Date.now()), sessionStorage); location.reload(); }
  }).catch(function () {});
} else {
  f.then(draw).catch(function (e) {
    var m = document.getElementById("m");
    m.innerHTML = "화면을 열지 못했습니다.<br><small></small><br><br><a href=''>다시 시도</a>";
    m.querySelector("small").textContent = e.message;
  });
}
})();
</script>
</body>
</html>
